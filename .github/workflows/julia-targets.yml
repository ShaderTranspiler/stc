name: Julia Targets

# central point for resolving targeted Julia versions from julia_targets.toml dynamically
# relies on scripts/julia_build_matrix.py and returns its output, ready for JSON parsing
# (see the script itself for details)

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
    outputs:
      julia:
        value: ${{ jobs.resolve.outputs.julia }}
      # these are always fetched for now (for simplicity), since they're singleton values anyways
      gl_utils_url:
        value: ${{ jobs.resolve.outputs.gl_utils_url }}
      gl_utils_rev:
        value: ${{ jobs.resolve.outputs.gl_utils_rev }}
      gl_utils_version:
        value: ${{ jobs.resolve.outputs.gl_utils_version }}


jobs:
  resolve:
    name: Resolve Julia Targets
    runs-on: ubuntu-latest
    outputs:
      julia: ${{ steps.versions.outputs.julia }}
      gl_utils_url: ${{ steps.versions.outputs.gl_utils_url }}
      gl_utils_rev: ${{ steps.versions.outputs.gl_utils_rev }}
      gl_utils_version: ${{ steps.versions.outputs.gl_utils_version }}

    steps:
      - uses: actions/checkout@v4
      - id: versions
        env:
          MODE: ${{ inputs.mode }}
        run: |
          JULIA=$(python3 scripts/julia_build_matrix.py "$MODE")
          GL_UTILS_URL=$(python3 scripts/julia_build_matrix.py gl-utils-url)
          GL_UTILS_REV=$(python3 scripts/julia_build_matrix.py gl-utils-rev)
          GL_UTILS_VERSION=$(python3 scripts/julia_build_matrix.py gl-utils-version)

          { echo "julia=$JULIA"; echo "gl_utils_url=$GL_UTILS_URL"; echo "gl_utils_rev=$GL_UTILS_REV";
            echo "gl_utils_version=$GL_UTILS_VERSION"; } >> "$GITHUB_OUTPUT"
