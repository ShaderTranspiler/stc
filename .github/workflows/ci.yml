name: CI

on:
  # feature/**, fix/** and hotfix/** are covered by their pull request run instead of a push run
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]
  schedule:
    # to catch upstream Julia drift/breakage
    - cron: "0 4 * * 1" # 4 AM, every Monday
  workflow_dispatch:

# newer commits invalidate in-flight runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # job to parse target info from julia_targets.toml dynamically
  setup:
    uses: ./.github/workflows/julia-targets.yml
    with:
      # scheduled runs check against latest Julia headers
      # other triggers run against pinned version (to not mix Julia-side errors with PR changes)
      mode: ${{ github.event_name == 'schedule' && 'floating' || 'pinned' }}

  # ensures that minimum Julia version in README.md (and in the future other docs) is kept up to date with julia_targets.toml
  verify_readme:
    name: Check Documented Julia Requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README.md
        run: |
          MIN=$(python3 scripts/julia_build_matrix.py min)
          grep -q "v$MIN\b" README.md || {
            echo "::error::README.md does not document v$MIN as the minimum Julia version"; exit 1; }

  build-and-test:
    name: Build & Test (${{ matrix.config.os }}, ${{ matrix.config.compiler }}, Julia v${{ matrix.julia }})
    runs-on: ${{ matrix.config.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        julia: ${{ fromJSON(needs.setup.outputs.julia) }}
        config:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
            cc: gcc
          - os: windows-latest
            compiler: msvc
            cxx: cl
            cc: cl

    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg Cache (for Catch2)
        if: matrix.config.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-catch2

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - name: Install JuliaGLM
        run: julia -e 'using Pkg; Pkg.add(url="https://github.com/Csabix/JuliaGLM", rev="glsl-functions")'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.compiler }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2.3"

      - name: Configure CMake
        run: >
          cmake -B build -S . 
          -DCMAKE_BUILD_TYPE=Debug 
          -DSTC_BUILD_TESTS=ON
          -DSTC_USE_FORMAT=OFF
          ${{ matrix.config.os == 'windows-latest' && '-DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"' || '' }}
          ${{ matrix.config.compiler == 'gcc' && '-DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage"' || '' }}

      - name: Build
        run: cmake --build build -j

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

      - name: Generate Coverage (GCC Only)
        if: matrix.config.compiler == 'gcc'
        run: |
          sudo apt-get install -y lcov
          lcov --capture --directory build \
            --exclude '/usr/*' \
            --exclude '*/test/*' \
            --exclude '*/sandbox/*' \
            --exclude '*/generated/*' \
            --exclude '*/_deps/*' \
            --ignore-errors unused \
            --output-file coverage.info
          lcov --ignore-errors unused --remove coverage.info '/usr/*' '*/test/*' '*/sandbox/*' '*/generated/*' '*/_deps/*' \
            --output-file coverage.info

      - name: Upload Coverage
        if: matrix.config.compiler == 'gcc'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # central build-and-test aggregator
  # can be used for status check requirements without it having to be updated after CI matrix changes
  build-and-test-gate:
    name: Build & Test
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.build-and-test.result }}" = "success" ] || exit 1
